name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI gates on lint, typecheck, build and unit tests (excluding the repro
# suite). The repro/integration step is intentionally non-blocking: those
# tests are intentionally-red INTENT/REPRO pinpointing not-yet-built fixes.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` drifted CI onto a bun whose module-mock
          # behavior failed tests/unit/opencode-server.test.ts even though
          # it passes locally.
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: bun run lint

      # `next typegen` first: a fresh CI checkout has no next-env.d.ts and no
      # .next/types, so tsc can't resolve image imports (`@/app/logo.png`) or
      # the route-aware globals (PageProps/LayoutProps).
      - name: Generate Next.js types
        run: bunx next typegen

      - name: Typecheck
        run: bun run typecheck

      # Unit tests gate CI, excluding the intentionally-red repro suite
      # (stream-flush-repro.test.ts) — see the informational step below.
      - name: Unit tests
        run: bun test --preload ./tests/setup.ts $(ls tests/unit/*.test.ts | grep -v -- '-repro\.test\.ts$')
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Non-blocking while REPRO/INTENT tests document unbuilt behavior.
      # Splitting this out keeps integration mocks from poisoning the unit
      # suite: bun's mock.module is process-global, so files that mock
      # @/lib/opencode/server can shadow it for tests/unit/opencode-server.test.ts
      # depending on file evaluation order.
      - name: Repro & integration tests (informational)
        run: bun test --preload ./tests/setup.ts tests/unit/stream-flush-repro.test.ts tests/integration/
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        continue-on-error: true

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-not-a-real-secret
