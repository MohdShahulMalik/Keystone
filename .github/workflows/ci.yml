name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Failures here are informational on purpose: the test suite still contains
# intentionally-red INTENT tests documenting not-yet-built features. CI gates
# on lint, typecheck and build; `bun test` runs as a non-blocking report step.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      # Non-blocking while INTENT tests document unbuilt behavior.
      - name: Tests
        run: bun test --preload ./tests/setup.ts tests/
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        continue-on-error: true

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-not-a-real-secret
